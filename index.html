<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise!</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>

    <style>
        :root {
            /* ========================================== */
            /* --- CUSTOMIZATION: COLORS --- */
            /* ========================================== */
            /* You can change the background colors here */
            --bg-gradient-start: #ff9a9e;
            --bg-gradient-end: #fecfef;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #ff6b6b;
            --primary-hover: #ff5252;
            --font-family: 'Poppins', sans-serif;
        }

        * {
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            transition: background 1s ease;
            color: var(--text-color);
        }

        .screen {
            display: none;
            background: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            max-width: 450px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .screen.active {
            display: block;
        }

        #reward-screen {
            max-width: 600px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1,
        h2 {
            margin-top: 0;
            color: var(--text-color);
        }

        p {
            color: #666;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 12px 1rem;
            margin: 1rem 0;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            text-align: center;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.2);
        }

        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #f44336;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        .feedback-msg {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 15px 0;
            display: none;
        }

        /* Scratch Card Styles */
        #scratch-container {
            position: relative;
            width: 100%;
            max-width: 1428px;
            aspect-ratio: 1428 / 818;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            background: #fff;
        }

        #laptop-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 2;
            touch-action: none;
        }

        .birthday-text {
            display: none;
            margin-top: 2rem;
            animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes floatImage {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px) scale(1.02);
            }

            100% {
                transform: translateY(0);
            }
        }

        @keyframes glowImage {
            from {
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            }

            to {
                box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
            }
        }

        .revealed-image {
            animation: floatImage 3s ease-in-out infinite !important;
        }

        .revealed-container {
            animation: glowImage 2s infinite alternate !important;
        }

        .birthday-text h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 2.2rem;
            line-height: 1.2;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.05);
        }

        .birthday-text p {
            font-size: 1.8rem;
            margin: 15px 0 0;
            letter-spacing: 5px;
        }

        @keyframes bgShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        body.party-mode {
            background: linear-gradient(270deg, #ff9a9e, #fecfef, #a18cd1, #fbc2eb, #ff9a9e, #a18cd1) !important;
            background-size: 400% 400% !important;
            animation: bgShift 15s ease infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-20vh) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }

        .floating-emoji {
            position: fixed;
            z-index: 999;
            pointer-events: none;
            animation: floatUp 5s linear forwards;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.2));
        }

        .special-message {
            font-size: 1.3rem;
            color: #ff4081;
            font-weight: 600;
            margin-top: 20px;
            min-height: 2em;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <!-- 1. Password Screen -->
    <div id="password-screen" class="screen active">
        <h2>🔒 Unlock Surprise</h2>
        <p>Enter the secret password to continue.</p>
        <input type="password" id="password-input" placeholder="Enter password" autocomplete="off"
            onkeypress="handleEnter(event, unlock)">
        <button onclick="unlock()">Unlock</button>
        <div id="pwd-error" class="error-msg">Wrong password! Try again.</div>
    </div>


    <!-- 3. Reward Screen -->
    <div id="reward-screen" class="screen">
        <h2 id="reward-title">🎁 Here is birthday gift for you!</h2>
        <p id="reward-subtitle">Scratch to reveal your surprise!</p>

        <div id="scratch-container">
            <img id="laptop-image" alt="Secret Reward">
            <canvas id="scratch-canvas"></canvas>
        </div>

        <div id="birthday-text-container" class="birthday-text">
            <h1>HAPPY BIRTHDAY <br><span id="bday-name">NAME</span>!</h1>
            <p>🎂 🎁 🎈</p>
            <p id="special-message" class="special-message"></p>
        </div>
    </div>

    <script>
        // ==========================================
        // --- CUSTOMIZATION START ---
        // ==========================================

        // 1. Set the password here
        const PASSWORD = "Moktha";



        // 4. Set the birthday person's name here
        const BIRTHDAY_NAME = "Yuktha❤️"; // Change this to their name

        // 5. Set the laptop image URL for the scratch card reveal
        const LAPTOP_IMAGE_URL = "laptop.png";

        // ==========================================
        // --- CUSTOMIZATION END ---
        // ==========================================


        // --- App Logic ---

        // Helper for pressing Enter key
        function handleEnter(e, callback) {
            if (e.key === 'Enter') callback();
        }

        function unlock() {
            const pwdInput = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('pwd-error');

            // Case-insensitive password check
            if (pwdInput.trim().toUpperCase() === PASSWORD.toUpperCase()) {
                document.getElementById('password-screen').classList.remove('active');
                document.getElementById('reward-screen').classList.add('active');
                initScratchCard();
            } else {
                errorMsg.style.display = 'block';
                // Shake effect on input
                const inputEl = document.getElementById('password-input');
                inputEl.style.transform = 'translateX(-10px)';
                setTimeout(() => inputEl.style.transform = 'translateX(10px)', 50);
                setTimeout(() => inputEl.style.transform = 'translateX(0)', 100);
                setTimeout(() => errorMsg.style.display = 'none', 3000);
            }
        }


        // --- Scratch Card Logic ---

        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let isDrawing = false;
        let isRevealed = false;
        let scratchCheckCounter = 0;

        function initScratchCard() {
            canvas.width = 1428;
            canvas.height = 818;

            // Draw gray overlay
            ctx.fillStyle = '#b0bec5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add instructions text to overlay
            ctx.fillStyle = '#ffffff';
            ctx.font = '700 22px Poppins, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('', canvas.width / 2, canvas.height / 2 - 25);
            ctx.font = '700 30px Poppins, sans-serif';
            ctx.fillText('↓', canvas.width / 2, canvas.height / 2 + 5);
            ctx.font = '700 24px Poppins, sans-serif';
            ctx.fillText('', canvas.width / 2, canvas.height / 2 + 35);

            // Set the underlying image
            document.getElementById('laptop-image').src = LAPTOP_IMAGE_URL;

            // Event Listeners for scratching
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            // Support for touch devices
            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
        }

        function startDrawing(e) {
            if (isRevealed) return;
            isDrawing = true;
            draw(e);
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function draw(e) {
            if (!isDrawing || isRevealed) return;
            e.preventDefault(); // Prevent scrolling on mobile while scratching

            const rect = canvas.getBoundingClientRect();
            let x, y;
            if (e.touches && e.touches.length > 0) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }

            // Handle canvas scaling if CSS size differs from width/height attributes
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            x *= scaleX;
            y *= scaleY;

            // "Erase" the overlay
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 80, 0, Math.PI * 2); // Increased brush size to 80 for larger canvas
            ctx.fill();

            // Check percentage periodically to optimize performance
            scratchCheckCounter++;
            if (scratchCheckCounter % 15 === 0) {
                checkRevealPercentage();
            }
        }

        function checkRevealPercentage() {
            if (isRevealed) return;

            // Only check the center 60% of the canvas to trigger the reveal
            const checkW = canvas.width * 0.6;
            const checkH = canvas.height * 0.6;
            const startX = (canvas.width - checkW) / 2;
            const startY = (canvas.height - checkH) / 2;

            const pixels = ctx.getImageData(startX, startY, checkW, checkH).data;
            let transparentCount = 0;
            const totalPixels = pixels.length / 4;

            // Check every 16th pixel to calculate fast
            const stride = 16;
            for (let i = 0; i < pixels.length; i += 4 * stride) {
                // Alpha channel is at index i + 3
                if (pixels[i + 3] < 128) {
                    transparentCount++;
                }
            }

            const percentage = (transparentCount / (totalPixels / stride)) * 100;

            // Reveal when 40% of the center area is scratched
            if (percentage >= 40) {
                isRevealed = true;

                // Hide canvas smoothly
                canvas.style.transition = 'opacity 1s ease-out';
                canvas.style.opacity = '0';

                // Clean up DOM after fade out
                setTimeout(() => {
                    canvas.style.display = 'none';
                    triggerBirthdayAnimation();
                }, 1000);
            }
        }

        function triggerBirthdayAnimation() {
            // Hide title/subtitle to make room for birthday text
            document.getElementById('reward-title').style.display = 'none';
            document.getElementById('reward-subtitle').style.display = 'none';

            // Show birthday text
            const textContainer = document.getElementById('birthday-text-container');
            document.getElementById('bday-name').innerText = BIRTHDAY_NAME;
            textContainer.style.display = 'block';

            // Change background dynamically
            document.body.classList.add('party-mode');

            // Interactive 3D Tilt Effect on the Container
            const container = document.getElementById('scratch-container');
            container.style.transformStyle = 'preserve-3d';
            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const xMid = rect.width / 2;
                const yMid = rect.height / 2;
                const xRotation = ((y - yMid) / yMid) * -10;
                const yRotation = ((x - xMid) / xMid) * 10;
                container.style.transform = `perspective(1000px) rotateX(${xRotation}deg) rotateY(${yRotation}deg) scale(1.05)`;
                container.style.transition = 'none';
            });
            container.addEventListener('mouseleave', () => {
                container.style.transform = `perspective(1000px) rotateX(0) rotateY(0) scale(1)`;
                container.style.transition = 'transform 0.5s ease';
            });

            // Typewriter Effect for Special Message
            const msg = "Wishing you a lifetime of happiness, success, and endless joy! ❤️";
            let i = 0;
            function typeWriter() {
                if (i < msg.length) {
                    document.getElementById("special-message").innerHTML += msg.charAt(i);
                    i++;
                    setTimeout(typeWriter, 60);
                }
            }
            setTimeout(typeWriter, 1500);

            // Create Floating Emojis
            function createFloatingEmojis() {
                const emojis = ['❤️', '🎉', '🎁', '✨', '🎂'];
                const interval = setInterval(() => {
                    const el = document.createElement('div');
                    el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    el.className = 'floating-emoji';
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    el.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 6000);
                }, 300);
                setTimeout(() => clearInterval(interval), 10000);
            }
            createFloatingEmojis();

            // Add classes for image animation
            document.getElementById('laptop-image').classList.add('revealed-image');
            document.getElementById('scratch-container').classList.add('revealed-container');

            // Fire Extended Confetti Show!
            const duration = 10000; // 10 seconds of fireworks
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function () {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                // since particles fall down, start a bit higher than random
                confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
                confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
            }, 250);
        }
    </script>
</body>

</html>
